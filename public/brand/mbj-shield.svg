<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="mbj-shield-title mbj-shield-desc">
  <title id="mbj-shield-title">Escudo do Meia Boca Juniors</title>
  <desc id="mbj-shield-desc">Escudo azul com contorno dourado, estrelas douradas e as letras MBJ.</desc>

  <defs>
    <!-- Estrela de cinco pontas, centrada na origem, ~13px de altura. -->
    <path id="mbj-star" fill="#E6B014"
      d="M0-6.5 1.9-2 6.5-1.6 3 1.4l1.1 4.7L0 3.7l-4.1 2.4L-3 1.4-6.5-1.6-1.9-2Z" />
  </defs>

  <!-- Contorno dourado do escudo -->
  <path fill="#E6B014"
    d="M256 12 484 84v190c0 110-92 192-228 232C120 466 28 384 28 274V84Z" />
  <!-- Campo azul -->
  <path fill="#14418E"
    d="M256 44 456 107v167c0 96-80 168-200 204C136 442 56 370 56 274V107Z" />
  <!-- Filete dourado interno -->
  <path fill="none" stroke="#E6B014" stroke-width="7"
    d="M256 66 436 122v152c0 86-72 150-180 184C148 424 76 360 76 274V122Z" />

  <!-- Campo de estrelas superior -->
  <g>
    <use href="#mbj-star" transform="translate(230 108)" />
    <use href="#mbj-star" transform="translate(282 108)" />

    <use href="#mbj-star" transform="translate(152 142)" />
    <use href="#mbj-star" transform="translate(204 142)" />
    <use href="#mbj-star" transform="translate(256 142)" />
    <use href="#mbj-star" transform="translate(308 142)" />
    <use href="#mbj-star" transform="translate(360 142)" />

    <use href="#mbj-star" transform="translate(126 176)" />
    <use href="#mbj-star" transform="translate(178 176)" />
    <use href="#mbj-star" transform="translate(230 176)" />
    <use href="#mbj-star" transform="translate(282 176)" />
    <use href="#mbj-star" transform="translate(334 176)" />
    <use href="#mbj-star" transform="translate(386 176)" />
  </g>

  <!-- Letras MBJ -->
  <text x="256" y="292" fill="#E6B014" text-anchor="middle"
    font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="116" font-weight="900"
    letter-spacing="4">MBJ</text>

  <!-- Campo de estrelas inferior -->
  <g>
    <use href="#mbj-star" transform="translate(126 330)" />
    <use href="#mbj-star" transform="translate(178 330)" />
    <use href="#mbj-star" transform="translate(230 330)" />
    <use href="#mbj-star" transform="translate(282 330)" />
    <use href="#mbj-star" transform="translate(334 330)" />
    <use href="#mbj-star" transform="translate(386 330)" />

    <use href="#mbj-star" transform="translate(152 366)" />
    <use href="#mbj-star" transform="translate(204 366)" />
    <use href="#mbj-star" transform="translate(256 366)" />
    <use href="#mbj-star" transform="translate(308 366)" />
    <use href="#mbj-star" transform="translate(360 366)" />

    <use href="#mbj-star" transform="translate(178 402)" />
    <use href="#mbj-star" transform="translate(230 402)" />
    <use href="#mbj-star" transform="translate(282 402)" />
    <use href="#mbj-star" transform="translate(334 402)" />

    <use href="#mbj-star" transform="translate(204 436)" />
    <use href="#mbj-star" transform="translate(256 436)" />
    <use href="#mbj-star" transform="translate(308 436)" />
  </g>
</svg>
