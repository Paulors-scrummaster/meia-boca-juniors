<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none" aria-hidden="true">
  <!--
    Fundo do cartão: brilho dourado radial + raios em explosão + partículas.
    Tudo em `currentColor` (token dourado) sobre opacidades baixas; o gradiente
    navy fica no contêiner do componente. Nenhuma referência às imagens JPEG.
  -->
  <defs>
    <radialGradient id="mbjCardGlow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.5" />
      <stop offset="0.45" stop-color="currentColor" stop-opacity="0.16" />
      <stop offset="1" stop-color="currentColor" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="400" height="600" fill="url(#mbjCardGlow)" />

  <!-- Raios em explosão a partir do centro-alto -->
  <g transform="translate(200 236)" fill="currentColor" opacity="0.09">
    <g>
      <polygon points="0,0 -14,-360 14,-360" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(30)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(60)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(90)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(120)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(150)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(180)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(210)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(240)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(270)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(300)" />
      <polygon points="0,0 -14,-360 14,-360" transform="rotate(330)" />
    </g>
  </g>

  <!-- Camada de partículas -->
  <g fill="currentColor">
    <circle cx="58" cy="120" r="2.5" opacity="0.30" />
    <circle cx="96" cy="66" r="1.6" opacity="0.22" />
    <circle cx="150" cy="150" r="2" opacity="0.28" />
    <circle cx="212" cy="88" r="1.4" opacity="0.20" />
    <circle cx="286" cy="126" r="2.6" opacity="0.32" />
    <circle cx="330" cy="72" r="1.8" opacity="0.24" />
    <circle cx="352" cy="180" r="2.2" opacity="0.26" />
    <circle cx="44" cy="220" r="1.6" opacity="0.20" />
    <circle cx="120" cy="250" r="2.4" opacity="0.30" />
    <circle cx="250" cy="220" r="1.5" opacity="0.18" />
    <circle cx="316" cy="264" r="2" opacity="0.26" />
    <circle cx="72" cy="320" r="2.2" opacity="0.24" />
    <circle cx="196" cy="300" r="1.6" opacity="0.18" />
    <circle cx="300" cy="340" r="2.4" opacity="0.28" />
    <circle cx="150" cy="380" r="1.8" opacity="0.20" />
    <circle cx="250" cy="392" r="2" opacity="0.22" />
    <circle cx="90" cy="430" r="1.5" opacity="0.16" />
    <circle cx="330" cy="430" r="1.7" opacity="0.18" />
    <circle cx="200" cy="470" r="1.4" opacity="0.14" />
  </g>
</svg>
