name: Verified Supabase backup
run-name: MBJ backup ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: PII-free UUID used only for run correlation
        required: true
        type: string
  workflow_call:
    inputs:
      request_id:
        description: PII-free UUID used only for run correlation
        required: true
        type: string
    outputs:
      backup_id:
        description: Opaque verified backup identifier
        value: ${{ jobs.backup.outputs.backup_id }}
      manifest_sha256:
        description: SHA-256 of the plaintext manifest inside the encrypted set
        value: ${{ jobs.backup.outputs.manifest_sha256 }}
      encrypted_object_key:
        description: Allowlisted private R2 object key
        value: ${{ jobs.backup.outputs.encrypted_object_key }}
      verified_at:
        description: UTC verification timestamp
        value: ${{ jobs.backup.outputs.verified_at }}
      verification_status:
        description: VERIFIED only after remote readback and cleanup
        value: ${{ jobs.backup.outputs.verification_status }}

permissions:
  contents: read

concurrency:
  group: mbj-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref_name == 'main'
    runs-on: windows-2025
    environment: backup
    timeout-minutes: 45
    outputs:
      backup_id: ${{ steps.result.outputs.backup_id }}
      manifest_sha256: ${{ steps.result.outputs.manifest_sha256 }}
      encrypted_object_key: ${{ steps.result.outputs.encrypted_object_key }}
      verified_at: ${{ steps.result.outputs.verified_at }}
      verification_status: ${{ steps.result.outputs.verification_status }}
    steps:
      - name: Checkout the protected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate request and protected ref
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          $parsed = [guid]::Empty
          if (-not [guid]::TryParseExact($env:REQUEST_ID, 'D', [ref]$parsed)) {
            throw 'request_id must be a canonical UUID'
          }
          if ('${{ github.ref_name }}' -ne 'main') {
            throw 'backup execution is restricted to protected main'
          }

      - name: Install pinned database and R2 clients
        shell: pwsh
        run: |
          choco install postgresql17 --version=17.6.0 --yes --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw 'PostgreSQL client installation failed' }
          choco install awscli --version=2.28.8 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { throw 'AWS CLI installation failed' }
          $pgBin = 'C:\Program Files\PostgreSQL\17\bin'
          $pgBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned age with checksum verification
        shell: pwsh
        env:
          AGE_VERSION: 1.3.2
          AGE_WINDOWS_SHA256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'age.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'age-tools'
          Invoke-WebRequest -Uri "https://github.com/FiloSottile/age/releases/download/v$env:AGE_VERSION/age-v$env:AGE_VERSION-windows-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:AGE_WINDOWS_SHA256) { throw 'age archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          (Join-Path $tools 'age') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Remove-Item -LiteralPath $archive -Force

      - name: Install locked Supabase CLI and verify tool versions
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          $supabaseVersion = npx --no-install supabase --version
          if ($supabaseVersion.Trim() -ne '2.116.0') { throw 'Unexpected Supabase CLI version' }
          if ((age --version) -notmatch '1\.3\.2') { throw 'Unexpected age version' }
          if ((aws --version) -notmatch 'aws-cli/2\.28\.8') { throw 'Unexpected AWS CLI version' }
          if ((pg_dump --version) -notmatch '17\.6') { throw 'Unexpected pg_dump version' }

      - name: Export, encrypt, upload, verify, and retain
        id: export
        shell: pwsh
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          MBJ_BACKUP_ENVIRONMENT: ${{ vars.MBJ_BACKUP_ENVIRONMENT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          REQUEST_ID: ${{ inputs.request_id }}
          RESULT_PATH: ${{ runner.temp }}\backup-result.json
        run: |
          & ./scripts/backup/export-supabase.ps1 `
            -RequestId $env:REQUEST_ID `
            -ProjectRef $env:SUPABASE_PROJECT_REF `
            -AgeRecipient $env:AGE_RECIPIENT `
            -GitCommit '${{ github.sha }}' `
            -RunId '${{ github.run_id }}' `
            -ResultPath $env:RESULT_PATH `
            -SupabaseCommand (Join-Path $PWD 'node_modules\.bin\supabase.cmd')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate sanitized result and publish typed outputs
        id: result
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          RESULT_PATH: ${{ runner.temp }}\backup-result.json
        run: |
          $result = Get-Content -Raw -LiteralPath $env:RESULT_PATH | ConvertFrom-Json
          if ($result.contractVersion -ne 1 -or $result.requestId -ne $env:REQUEST_ID) { throw 'Result contract/request mismatch' }
          if ([string]$result.runId -ne $env:EXPECTED_RUN_ID -or $result.status -ne 'VERIFIED') { throw 'Result run/status mismatch' }
          if ($result.manifestSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid manifest checksum' }
          if ($result.encryptedObjectKey -notmatch '^backups/[0-9]{4}/[0-9]{2}/[0-9a-f]{32}\.age$') { throw 'Invalid object key' }
          if ($result.backupId -notmatch '^[0-9a-f]{32}$') { throw 'Invalid backup ID' }
          $verifiedAt = [DateTimeOffset]::Parse($result.verifiedAt)
          if ($verifiedAt -lt [DateTimeOffset]::UtcNow.AddHours(-1) -or $verifiedAt -gt [DateTimeOffset]::UtcNow.AddMinutes(5)) { throw 'Verification timestamp outside execution window' }
          "backup_id=$($result.backupId)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_sha256=$($result.manifestSha256)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "encrypted_object_key=$($result.encryptedObjectKey)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verified_at=$($result.verifiedAt)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'verification_status=VERIFIED' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload one-day sanitized manual result
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}\backup-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove runner backup material
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'mbj-backup-*' -or $_.Name -match '^[0-9a-f]{32}\.(tar|age|verify\.age)$' -or $_.Name -eq 'backup-result.json' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
