name: Weekly backup freshness check

# Compensating control for the UptimeRobot Free plan dropping heartbeat/cron
# monitors (T180). Fails when the newest verified backup run on main is missing
# or older than the weekly cadence plus slack, so GitHub's failed-run
# notification reaches the project owner. It does not replace the in-workflow
# failure alert (MBJ_BACKUP_FAILURE_WEBHOOK_URL); it covers the case where the
# weekly n8n schedule never fires at all.

on:
  schedule:
    # Daily, 12:00 UTC. Detection latency is at most 24h after a set goes stale.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: Age threshold in hours for the newest verified backup run (default 192 = 8 days)
        required: false
        default: '192'

permissions:
  actions: read
  contents: read

concurrency:
  group: mbj-backup-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: Verified backup freshness
    runs-on: ubuntu-latest
    steps:
      - name: Assert the weekly verified backup is recent
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || '192' }}
        run: |
          set -euo pipefail

          threshold="${MAX_AGE_HOURS}"
          if ! [[ "${threshold}" =~ ^[0-9]+$ ]]; then
            echo "FAIL: max_age_hours must be a non-negative integer, got '${threshold}'" >&2
            exit 1
          fi

          latest="$(
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/backup.yml/runs" \
              -f branch=main \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].run_started_at // .workflow_runs[0].created_at // empty'
          )"

          if [ -z "${latest}" ]; then
            echo "FAIL: no successful run of backup.yml on main was found" >&2
            echo "The weekly n8n backup orchestrator may be inactive or failing." >&2
            exit 1
          fi

          latest_epoch="$(date -u -d "${latest}" +%s)"
          now_epoch="$(date -u +%s)"
          age_hours=$(((now_epoch - latest_epoch) / 3600))

          echo "newest_verified_backup_run_age_hours=${age_hours}"
          echo "threshold_hours=${threshold}"

          if [ "${age_hours}" -gt "${threshold}" ]; then
            echo "FAIL: newest verified backup run is ${age_hours}h old (> ${threshold}h)" >&2
            echo "Investigate the n8n weekly schedule and backup.yml before the next migration." >&2
            exit 1
          fi

          echo "PASS: newest verified backup run is ${age_hours}h old (<= ${threshold}h)"
